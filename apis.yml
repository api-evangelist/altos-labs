name: Altos Labs
description: 'Altos Labs is a biotechnology company pursuing cellular rejuvenation programming
  to restore cell health and resilience, with the goal of reversing disease, injury, and
  the disabilities that can occur throughout life. Launched publicly in January 2022 with
  roughly $3 billion in initial funding from investors including Jeff Bezos and Yuri Milner,
  the company operates geographically distributed Institutes of Science in the San Francisco
  Bay Area, Cambridge (UK), and San Diego, alongside an Institute of Medicine and an
  Institute of Computation. Altos combines experimental biologists with computational
  scientists to translate laboratory discoveries in cell biology into transformative
  medicines. It was surfaced as a portfolio company of General Catalyst and added to the
  API Evangelist network; as a research-stage life-sciences company it currently exposes
  no public developer API surface.'
